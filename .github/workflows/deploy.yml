# Ana dala (main) her birleştirmede uygulamayı ve sunucuyu Cloudflare'e yükler.
# Bir kez GitHub > Settings > Secrets and variables > Actions > New repository secret ile ekleyin:
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens > "Edit Cloudflare Workers" şablonu (ücretsiz)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare panelinde Workers & Pages sayfasının sağındaki "Account ID"
#   D1_DATABASE_ID         worker/wrangler.toml'a elle yazdığınız database_id (npx wrangler d1 list ile de görülür)
#   VAPID_SUBJECT          wrangler.toml'daki VAPID_SUBJECT değeri, ör. mailto:siz@ornek.com
# Gizli anahtarlar (VAPID_PRIVATE_JWK, DEEPSEEK_API_KEY…) Cloudflare'de kalır; burada gerekmez.
# Elle çalıştırmak için: Actions > Cloudflare'e yükle > Run workflow.
name: Cloudflare'e yükle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: Anahtarlar tanımlı mı?
        id: check
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID VAPID_SUBJECT; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Yükleme atlandı. Eksik GitHub secret:$missing (bkz. .github/workflows/deploy.yml başı)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Bağımlılıklar
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: npm ci

      - name: Hızlı testler
        if: steps.check.outputs.ok == 'true'
        run: node tests/date-math.test.js && node tests/market-parsers.test.js

      - name: Ayarları yaz (database_id, VAPID_SUBJECT)
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: |
          printf '%s' "$D1_DATABASE_ID" | grep -Eq '^[0-9a-f-]{36}$' || { echo "::error::D1_DATABASE_ID biçimi hatalı"; exit 1; }
          sed -i "s|^database_id = .*|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          SUBJ=$(printf '%s' "$VAPID_SUBJECT" | sed 's/[\\&|"]//g')
          sed -i "s|^VAPID_SUBJECT = .*|VAPID_SUBJECT = \"$SUBJ\"|" wrangler.toml

      - name: Yükle
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler deploy
