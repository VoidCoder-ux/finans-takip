# Ana dala (main) her birleştirmede uygulamayı ve sunucuyu Cloudflare'e yükler.
# Bir kez GitHub > Settings > Secrets and variables > Actions > New repository secret ile ekleyin:
#   CLOUDFLARE_API_TOKEN   Cloudflare > My Profile > API Tokens > "Edit Cloudflare Workers" şablonu (ücretsiz)
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare panelinde Workers & Pages sayfasının sağındaki "Account ID"
#   D1_DATABASE_ID         worker/wrangler.toml'a elle yazdığınız database_id (npx wrangler d1 list ile de görülür)
#   VAPID_SUBJECT          wrangler.toml'daki VAPID_SUBJECT değeri, ör. mailto:siz@ornek.com
# Gizli anahtarlar (VAPID_PRIVATE_JWK, DEEPSEEK_API_KEY…) Cloudflare'de kalır; burada gerekmez.
# Elle çalıştırmak için: Actions > Cloudflare'e yükle > Run workflow.
name: Cloudflare'e yükle

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Ham secret'lar S_ önekiyle gelir; temizlenip denetlenen hâlleri asıl adlarla sonraki adımlara verilir
    env:
      S_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      S_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      S_D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      S_VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
    steps:
      - name: Anahtarlar tanımlı ve doğru biçimde mi?
        id: check
        run: |
          missing=""
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID D1_DATABASE_ID VAPID_SUBJECT; do
            s="S_$v"; [ -n "${!s}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Yükleme atlandı. Eksik GitHub secret:$missing (bkz. .github/workflows/deploy.yml başı)"
            echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Kopyalarken eklenen boşluk/satır sonu atılır; birden çok satır ya da fazladan metin varsa anlaşılır hata verilir
          tok=$(printf '%s' "$S_CLOUDFLARE_API_TOKEN" | tr -d ' \t\r\n')
          acc=$(printf '%s' "$S_CLOUDFLARE_ACCOUNT_ID" | tr -d ' \t\r\n')
          dbid=$(printf '%s' "$S_D1_DATABASE_ID" | tr -d ' \t\r\n"')
          subj=$(printf '%s' "$S_VAPID_SUBJECT" | tr -d '\t\r\n"' | sed 's/^ *//;s/ *$//')
          echo "::add-mask::$tok"; echo "::add-mask::$acc"; echo "::add-mask::$dbid"; echo "::add-mask::$subj"
          bad=""
          printf '%s' "$tok" | grep -Eq '^[A-Za-z0-9_-]{30,80}$' || bad="$bad CLOUDFLARE_API_TOKEN (yalnız anahtarın kendisi olmalı: tek satır, boşluksuz, ~40 karakter; 'curl' ya da 'Bearer' gibi ek yazı olmamalı)"
          printf '%s' "$acc" | grep -Eq '^[0-9a-f]{32}$' || bad="$bad CLOUDFLARE_ACCOUNT_ID (32 karakter, rakam ve a-f harfleri)"
          printf '%s' "$dbid" | grep -Eq '^[0-9a-f-]{36}$' || bad="$bad D1_DATABASE_ID (ör. 1a2b3c4d-....-....-....-............)"
          printf '%s' "$subj" | grep -Eq '^(mailto:|https://)' || bad="$bad VAPID_SUBJECT (mailto: ile başlamalı)"
          if [ -n "$bad" ]; then echo "::error::Şu secret'ları yeniden girin:$bad"; exit 1; fi
          { echo "CLOUDFLARE_API_TOKEN=$tok"; echo "CLOUDFLARE_ACCOUNT_ID=$acc"; echo "D1_DATABASE_ID=$dbid"; echo "VAPID_SUBJECT=$subj"; } >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.check.outputs.ok == 'true'

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Bağımlılıklar
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: npm ci

      - name: Hızlı testler
        if: steps.check.outputs.ok == 'true'
        run: node tests/date-math.test.js && node tests/market-parsers.test.js

      - name: Ayarları yaz (database_id, VAPID_SUBJECT)
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: |
          sed -i "s|^database_id = .*|database_id = \"$D1_DATABASE_ID\"|" wrangler.toml
          SUBJ=$(printf '%s' "$VAPID_SUBJECT" | sed 's/[\\&|"]//g')
          sed -i "s|^VAPID_SUBJECT = .*|VAPID_SUBJECT = \"$SUBJ\"|" wrangler.toml

      - name: Yükle
        if: steps.check.outputs.ok == 'true'
        working-directory: worker
        run: npx wrangler deploy
