# Tüm testler: hesaplama, kart, banka SMS/e-posta, ekstre, yedek, eşitleme (iki/üç cihaz), görsel tarama.
# Yerel (CI makinesindeki) wrangler dev sunucusuyla çalışır; canlı Cloudflare'e, bankaya ya da Gmail'e istek gitmez,
# gizli anahtar gerekmez. PR'larda ve main dışındaki dallarda çalışır; main'de yüklemeden önce deploy.yml çağırır.
name: Testler

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Bağımlılıklar
        working-directory: worker
        run: npm ci

      - name: Tarayıcı (Playwright + Chromium)
        run: |
          npm i -g playwright@1.56.1
          npx -y playwright@1.56.1 install --with-deps chromium

      - name: Yerel test sunucusu ayarları (sahte anahtarlar)
        working-directory: worker
        run: |
          JWK=$(node scripts/gen-vapid.mjs | tail -1)
          {
            echo "VAPID_PRIVATE_JWK='$JWK'"
            echo "ALLOW_INSECURE_PUSH=1"
            echo "MARKET_TCMB_URL=http://127.0.0.1:8799/tcmb"
            echo "MARKET_TRUNCGIL_URL=http://127.0.0.1:8799/truncgil"
            echo "MARKET_TEFAS_URL=http://127.0.0.1:8799/tefas"
            echo "MARKET_CPI_URL=http://127.0.0.1:8799/cpi"
            echo "DEEPSEEK_API_KEY=test-key"
            echo "DEEPSEEK_BASE_URL=http://127.0.0.1:8798"
            echo "RECEIPT_DAILY_LIMIT=4"
          } > .dev.vars

      - name: Tüm testler
        run: START_SERVER=1 REQUIRE_SERVER=1 bash tests/run-all.sh
